<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipeline Tuning Field Guide</title>
<meta name="description" content="Data pipeline performance tuning: measuring, reading less, incremental loads, joins, skew, writes, memory and orchestration, with a symptom finder and quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
<style>
/* Layout: chapter rail left, one chapter on stage, prev/next dock; collapses to a tab strip on phones. */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --surface:#ffffff; --ink:#1b211d; --muted:#5d6760; --line:#d9ddd6;
  --flow:#1f6f5c; --flow-soft:#e1efe9; --heat:#c4541b; --heat-soft:#fbe9df; --code-bg:#eef1ec;
  --ok:#2c7a46; --ok-soft:#e2f2e7; --bad:#b0302a; --bad-soft:#f9e3e1;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#171e1a; --surface:#171e1a; --ink:#e4ebe6; --muted:#97a59c; --line:#28332c;
  --flow:#5cc2a3; --flow-soft:#183229; --heat:#f08b55; --heat-soft:#3a2216; --code-bg:#1d2621;
  --ok:#7fd29c; --ok-soft:#173322; --bad:#f39a93; --bad-soft:#3b1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#171e1a; --surface:#171e1a; --ink:#e4ebe6; --muted:#97a59c; --line:#28332c;
  --flow:#5cc2a3; --flow-soft:#183229; --heat:#f08b55; --heat-soft:#3a2216; --code-bg:#1d2621;
  --ok:#7fd29c; --ok-soft:#173322; --bad:#f39a93; --bad-soft:#3b1b19; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}

.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 10px;border-radius:6px;font-family:var(--f-display);font-size:15px;color:var(--muted)}
.steps button .no{font-family:var(--f-mono);font-size:12px;padding-top:2px}
.steps button:hover{background:var(--flow-soft);color:var(--ink)}
.steps button:focus-visible{outline:2px solid var(--flow);outline-offset:1px}
.steps button[aria-current="step"]{background:var(--ink);color:var(--panel)}
.steps button.seen:not([aria-current]) .no{color:var(--flow)}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
.theme{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px;align-self:start}
.theme:focus-visible{outline:2px solid var(--flow)}

.stage{min-width:0;display:flex;flex-direction:column;gap:16px}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.meter i.on{background:var(--flow)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px 36px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--heat)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:40px;font-weight:800;margin-top:6px}
h2{font-size:22px;font-weight:600;margin-top:28px;margin-bottom:6px}
h3{font-size:17px;font-weight:600}
p{margin:10px 0;max-width:68ch}
.lead{font-size:19px}
ul.pts{margin:10px 0;padding-left:20px;max-width:70ch}
ul.pts li{margin:6px 0}
ul.pts li::marker{color:var(--flow)}
code{font-family:var(--f-mono);font-size:.85em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--code-bg);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:12px 0}
pre code{background:none;padding:0;font-size:inherit}
pre .c{color:var(--muted)}
pre .k{color:var(--flow);font-weight:500}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.box h3{margin-bottom:4px}
.box p{margin:4px 0;font-size:15.5px}
.do{border-left:4px solid var(--ok)} .dont{border-left:4px solid var(--bad)}
.do h3{color:var(--ok)} .dont h3{color:var(--bad)}

.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td:first-child{font-family:var(--f-display);font-weight:600;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.callout{background:var(--heat-soft);border-radius:8px;padding:12px 16px;margin:16px 0;max-width:72ch}
.callout b{font-family:var(--f-display);color:var(--heat)}

/* stage diagram */
.flow{display:flex;align-items:stretch;gap:0;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.stg{all:unset;cursor:pointer;flex:1 0 110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.stg:hover{border-color:var(--flow)}
.stg:focus-visible{outline:2px solid var(--flow)}
.stg[aria-pressed="true"]{border-color:var(--heat);background:var(--heat-soft)}
.stg b{font-family:var(--f-display);font-size:15px}
.stg .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stg .bar{height:6px;border-radius:3px;background:var(--flow)}
.stg.slow .bar{background:var(--heat)}
.arrow{align-self:center;color:var(--muted);padding:0 6px;font-family:var(--f-mono)}
.stgdetail{min-height:3em}

/* diagnostic */
.symptoms{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{all:unset;cursor:pointer;font-family:var(--f-display);font-size:14px;padding:6px 12px;border-radius:16px;border:1px solid var(--line)}
.chip:hover{border-color:var(--flow)}
.chip:focus-visible{outline:2px solid var(--flow);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.diag{border-top:1px solid var(--line);padding-top:12px}

/* checklist */
.check{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 8px;border-radius:6px}
.check label:hover{background:var(--flow-soft)}
.check input{margin-top:5px;accent-color:var(--flow);width:16px;height:16px;flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.tally{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* quiz */
.q{border-top:1px solid var(--line);padding:16px 0}
.q h3{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{all:unset;cursor:pointer;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:16px}
.opt:hover{border-color:var(--flow)}
.opt:focus-visible{outline:2px solid var(--flow)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:15.5px;color:var(--muted);margin-top:8px}
.score{font-family:var(--f-display);font-weight:600}

.dock{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;max-width:46%}
.nav:hover{border-color:var(--flow)}
.nav:focus-visible{outline:2px solid var(--flow);outline-offset:2px}
.nav[disabled]{visibility:hidden}
.nav small{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav b{font-family:var(--f-display);font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.next{margin-left:auto;text-align:right;background:var(--flow);border-color:var(--flow)}
.nav.next small,.nav.next b{color:var(--panel)}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.view{animation:in .22s ease-out}
@keyframes in{from{transform:translateY(5px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.meter i{transition:none}}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:static}
  .steps{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .steps button{white-space:nowrap;width:auto}
  .hint{display:none}
}
@media (max-width:560px){
  body{font-size:16px}
  .card{padding:22px 18px}
  h1{font-size:30px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Pipeline Tuning Field Guide<small>DATA PIPELINE PERFORMANCE</small></div>
    <ol class="steps" id="steps"></ol>
    <div class="hint"><kbd>←</kbd> <kbd>→</kbd> to page through</div>
    <button class="theme" id="theme" type="button">Theme: system</button>
  </aside>
  <main class="stage">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <article class="card view" id="view" aria-live="polite"></article>
    <div class="dock">
      <button class="nav prev" id="prev" type="button"><small>Back</small><b id="prevT"></b></button>
      <span class="counter" id="count"></span>
      <button class="nav next" id="next" type="button"><small>Next</small><b id="nextT"></b></button>
    </div>
  </main>
</div>

<script>
const STAGES=[
  {n:"Extract",t:4,d:"Pulling 40 M rows over JDBC with a single connection. One reader, one network stream."},
  {n:"Land",t:2,d:"Writing raw files to object storage. Fast, mostly I/O bound."},
  {n:"Transform",t:31,slow:true,d:"A join between orders and a 3 TB events table shuffles everything. One customer key holds 18% of the rows, so one task runs for 25 minutes while the rest finish in 2."},
  {n:"Load",t:9,d:"Row-by-row upserts into the warehouse. Switching to a staged bulk MERGE would cut this a lot."},
  {n:"Publish",t:1,d:"Refreshing a few views and sending a completion event."}
];
const SYMPTOMS={
  "One task runs far longer than the others":["<b>Data skew.</b> A few keys hold most of the rows.","Check the row count per key: <code>GROUP BY key ORDER BY count DESC</code>.","Fixes: salt the hot key, broadcast the small side, or turn on adaptive skew handling (Spark AQE <code>spark.sql.adaptive.skewJoin.enabled</code>)."],
  "Run time grows every day":["<b>Full reloads on a growing table.</b>","Switch to incremental loads using a watermark column or CDC.","Partition the target by date so each run touches only new partitions."],
  "Lots of disk spill in the job metrics":["<b>Partitions too big for executor memory.</b>","Increase the number of shuffle partitions, or let AQE coalesce them.","Drop columns you don't need before the shuffle. Check for wide rows (JSON blobs) carried through joins."],
  "Thousands of tiny output files":["<b>Small-files problem.</b> Every file adds open/list overhead for readers.","Aim for files of roughly 128 MB–1 GB. Repartition or coalesce before writing.","Run periodic compaction (<code>OPTIMIZE</code> in Delta, <code>rewrite_data_files</code> in Iceberg)."],
  "Query scans the whole table for one day":["<b>No pruning.</b> The filter can't skip data.","Partition or cluster on the column you filter by most.","Don't wrap the partition column in a function in the WHERE clause, because that blocks pruning."],
  "Cluster sits mostly idle":["<b>Too little parallelism, or waiting on a slow source.</b>","Read with several connections (partitioned JDBC reads with <code>partitionColumn</code>, <code>numPartitions</code>).","Look for serial steps in the orchestrator that could run in parallel."],
  "Warehouse load is slow":["<b>Row-by-row inserts or updates.</b>","Stage files and use bulk <code>COPY</code> / <code>MERGE</code>.","Batch commits. Disable or defer index maintenance during big loads where the warehouse allows it."]
};
const QUIZ=[
  {q:"A Spark join has 199 tasks finishing in 40 s and one task running 22 min. What is the most likely cause?",o:["Too few executors","Data skew on the join key","Wrong file format","Network latency to storage"],a:1,w:"One straggler among many fast tasks is the classic sign of skew: one key's rows all land in one partition."},
  {q:"Which change usually helps most when a nightly job reprocesses a 5-year table to add yesterday's rows?",o:["Bigger cluster","More shuffle partitions","Incremental load with a watermark","Switch CSV to JSON"],a:2,w:"Processing only new data turns the cost from 'grows with history' into 'grows with daily volume'."},
  {q:"Why does a columnar format such as Parquet speed up analytical reads?",o:["It stores rows in sorted order","Readers fetch only the columns they need and skip row groups using min/max stats","It is uncompressed","It avoids schemas"],a:1,w:"Column pruning plus predicate pushdown on row-group statistics cut I/O."},
  {q:"A 20 MB lookup table is joined to a 2 TB fact table. What's the usual best join strategy?",o:["Sort-merge join","Broadcast the lookup table","Cross join then filter","Nested loop join"],a:1,w:"Broadcasting the small side avoids shuffling the 2 TB table."},
  {q:"WHERE DATE(event_ts) = '2026-11-10' on a table partitioned by event_date scans every partition. Why?",o:["The date literal is wrong","Applying a function to the column hides it from the partition filter","Partitions are corrupt","Statistics are stale"],a:1,w:"Filter on the partition column directly: WHERE event_date = '2026-11-10'."},
  {q:"What should you do first before changing any configuration?",o:["Double the cluster size","Measure where time is actually spent","Rewrite the job in another language","Turn on caching everywhere"],a:1,w:"Tune the bottleneck you can measure. Changing anything else just moves cost around."}
];
const CHECK=[
  "Each stage's duration and row count is logged on every run",
  "Only new or changed data is processed (watermark, CDC or partition overwrite)",
  "Filters and column selection happen as early as possible",
  "Tables are partitioned or clustered on the columns used in filters",
  "Files are columnar (Parquet/ORC/Delta/Iceberg) and 128 MB–1 GB each",
  "Join keys are checked for skew",
  "Small dimension tables are broadcast",
  "Writes to the warehouse use bulk COPY/MERGE, not row-by-row",
  "Shuffle partitions are sized to the data, or adaptive execution is on",
  "Independent tasks in the orchestrator run in parallel",
  "Retries are idempotent so reruns don't duplicate data",
  "Cost per run is tracked next to run time"
];

const pts=a=>`<ul class="pts">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const dd=(d,n)=>`<div class="grid2"><div class="box do"><h3>Do</h3>${d.map(x=>`<p>${x}</p>`).join("")}</div><div class="box dont"><h3>Avoid</h3>${n.map(x=>`<p>${x}</p>`).join("")}</div></div>`;

let stageSel=2, symSel=Object.keys(SYMPTOMS)[0], answers={}, checks={};
try{checks=JSON.parse(localStorage.getItem("ptg-checks")||"{}")}catch(e){}

const STEPS=[
 {id:"start",t:"Start here",h:()=>`
  <div class="eyebrow">Overview</div><h1>Make the slow stage faster, not every stage</h1>
  <p class="lead">A pipeline is only as fast as its slowest stage. Most tuning wins come from finding that stage and fixing one of a handful of common causes: too much data read, too much data moved, uneven work, or slow writes.</p>
  <h2>Example: a nightly run, 47 minutes</h2>
  <p>Click a stage to see what it's doing.</p>
  <div class="flow" id="flow"></div>
  <p class="stgdetail" id="stgdetail"></p>
  <div class="callout"><b>Rule of thumb.</b> Speeding up Transform by half saves about 15 minutes. Making Publish instant saves one. Spend effort where the minutes are.</div>`,after:renderFlow},
 {id:"measure",t:"Measure first",h:()=>`
  <div class="eyebrow">Step 1</div><h1>Measure before you tune</h1>
  <p>Without numbers you'll tune the wrong thing. Record these for every stage on every run:</p>
  <div class="tbl"><table><thead><tr><th>Metric</th><th>What it tells you</th></tr></thead><tbody>
   <tr><td>Wall-clock time</td><td>Where the minutes go</td></tr>
   <tr><td>Rows in / rows out</td><td>Unexpected fan-out from joins, or filters that don't filter</td></tr>
   <tr><td>Bytes read / written</td><td>Whether pruning and column selection are working</td></tr>
   <tr><td>Shuffle bytes</td><td>How much data is moved between workers</td></tr>
   <tr><td>Spill to disk</td><td>Memory pressure in sorts, joins and aggregations</td></tr>
   <tr><td>Task time spread</td><td>Skew: compare the slowest task to the median</td></tr>
   <tr><td>CPU / idle %</td><td>Whether you're compute bound, I/O bound, or waiting</td></tr>
  </tbody></table></div>
  <h2>Where to look</h2>
  ${pts(["Spark: the Spark UI stages tab and <code>EXPLAIN FORMATTED</code>.","SQL warehouses: query profile / <code>EXPLAIN ANALYZE</code>, bytes scanned, partitions pruned.","Orchestrators (Airflow, Dagster, ADF): task durations over time, to spot slow drift."])}`},
 {id:"read-less",t:"Read less data",h:()=>`
  <div class="eyebrow">Step 2</div><h1>Read less data</h1>
  <p>The cheapest row is the one you never read.</p>
  ${pts(["<b>Columnar formats.</b> Parquet, ORC, Delta and Iceberg let readers fetch only the needed columns and skip blocks using min/max statistics.","<b>Partitioning.</b> Partition on a low-cardinality column you always filter by, usually a date. Avoid partitions so fine that each holds a tiny file.","<b>Clustering / Z-ordering.</b> Sort data within files on high-cardinality filter columns so more blocks can be skipped.","<b>Predicate and projection pushdown.</b> Filter and select columns as early as possible, ideally in the source query."])}
  <pre><code><span class="c">-- Blocks pruning: the function hides the partition column</span>
<span class="k">SELECT</span> * <span class="k">FROM</span> events <span class="k">WHERE</span> DATE(event_ts) = '2026-11-10';

<span class="c">-- Prunes: filter the partition column directly, select only what you need</span>
<span class="k">SELECT</span> user_id, amount <span class="k">FROM</span> events <span class="k">WHERE</span> event_date = '2026-11-10';</code></pre>
  ${dd(["Filter on the raw partition column","Keep files around 128 MB–1 GB","Compress with Snappy or ZSTD"],["SELECT * through a whole pipeline","CSV or JSON for large analytical tables","Partitioning by user ID or timestamp"])}`},
 {id:"incremental",t:"Process only what changed",h:()=>`
  <div class="eyebrow">Step 3</div><h1>Process only what changed</h1>
  <p>A full reload gets slower every day because history keeps growing. An incremental load costs about the same each day.</p>
  <div class="tbl"><table><thead><tr><th>Pattern</th><th>How it works</th><th>Watch out for</th></tr></thead><tbody>
   <tr><td>Watermark</td><td>Read rows where <code>updated_at</code> &gt; last high-water mark</td><td>Late-arriving rows, clock drift, missing updates when the column isn't maintained</td></tr>
   <tr><td>CDC</td><td>Read inserts, updates and deletes from the source's change log</td><td>Setup effort, ordering, schema changes</td></tr>
   <tr><td>Partition overwrite</td><td>Rebuild only today's (or the affected) partitions</td><td>Must know which partitions changed</td></tr>
   <tr><td>Hash diff</td><td>Compare a hash of the row with the stored hash, load only differences</td><td>Still reads the full source, but writes much less</td></tr>
  </tbody></table></div>
  <pre><code><span class="k">MERGE INTO</span> dw.orders t
<span class="k">USING</span> (<span class="k">SELECT</span> * <span class="k">FROM</span> staging.orders <span class="k">WHERE</span> updated_at &gt; :last_watermark) s
<span class="k">ON</span> t.order_id = s.order_id
<span class="k">WHEN MATCHED</span> <span class="k">THEN UPDATE SET</span> *
<span class="k">WHEN NOT MATCHED</span> <span class="k">THEN INSERT</span> *;</code></pre>
  <div class="callout"><b>Make it rerunnable.</b> A MERGE on a stable key is idempotent: running it twice gives the same result. That makes retries safe.</div>`},
 {id:"shuffle",t:"Joins and shuffles",h:()=>`
  <div class="eyebrow">Step 4</div><h1>Move less data between workers</h1>
  <p>Joins, GROUP BY, DISTINCT and window functions redistribute rows across the cluster (a shuffle). Shuffles cost network, disk and memory, and they are usually the most expensive part of a distributed job.</p>
  <div class="tbl"><table><thead><tr><th>Join type</th><th>Use when</th><th>Cost</th></tr></thead><tbody>
   <tr><td>Broadcast</td><td>One side is small (roughly under a few hundred MB)</td><td>Small side copied to every worker, big side not moved</td></tr>
   <tr><td>Sort-merge</td><td>Both sides large</td><td>Both sides shuffled and sorted</td></tr>
   <tr><td>Shuffle hash</td><td>One side fits in memory per partition</td><td>Both sides shuffled, no sort</td></tr>
   <tr><td>Bucketed</td><td>Same tables joined on the same key many times</td><td>Shuffle paid once at write time</td></tr>
  </tbody></table></div>
  <pre><code><span class="c"># PySpark: broadcast a small dimension</span>
<span class="k">from</span> pyspark.sql.functions <span class="k">import</span> broadcast
facts.join(broadcast(dim_country), "country_id")

<span class="c"># Let adaptive execution resize partitions and handle skew</span>
spark.conf.set("spark.sql.adaptive.enabled", "true")</code></pre>
  ${dd(["Filter and aggregate before joining","Drop wide columns before the shuffle","Reuse a partitioning across consecutive steps"],["Joining before filtering","Several DISTINCTs on large data when one GROUP BY would do","Accidental cross joins from missing join keys"])}`},
 {id:"skew",t:"Skew and parallelism",h:()=>`
  <div class="eyebrow">Step 5</div><h1>Spread the work evenly</h1>
  <p>Parallel jobs finish when the slowest task finishes. If one key holds a large share of the rows, one task gets all of them.</p>
  <h2>Spotting skew</h2>
  ${pts(["Max task time is many times the median.","One partition is far larger in shuffle read size.","Row counts per key show a few huge keys, often <code>NULL</code>, <code>'unknown'</code> or a test account."])}
  <h2>Fixing it</h2>
  ${pts(["<b>Filter junk keys.</b> Handle <code>NULL</code> keys separately if they can't match anyway.","<b>Broadcast</b> the other side if it's small enough.","<b>Salting.</b> Add a random suffix to the hot key on the big side and duplicate the matching rows on the small side.","<b>Adaptive execution.</b> Spark AQE can split skewed partitions automatically."])}
  <h2>Sizing parallelism</h2>
  ${pts(["Aim for partitions of about 100–200 MB after the shuffle.","Have at least 2–3 tasks per CPU core so fast tasks fill gaps.","Read sources in parallel too. A single JDBC connection is a common hidden bottleneck."])}`},
 {id:"write",t:"Writes and loads",h:()=>`
  <div class="eyebrow">Step 6</div><h1>Write efficiently</h1>
  ${pts(["<b>Bulk loads.</b> Stage files in object storage and use <code>COPY</code> or a bulk <code>MERGE</code>. Row-by-row INSERT or UPDATE through a driver is often 100× slower.","<b>File sizes.</b> Repartition before writing so you get fewer, larger files. Many tiny files slow down every later read.","<b>Compaction.</b> Streaming and frequent micro-batches create small files. Compact them on a schedule.","<b>Indexes and constraints.</b> On row stores, heavy index maintenance slows big loads. Some teams drop and rebuild indexes around large loads.","<b>Transactions.</b> Commit in batches, not per row."])}
  <div class="tbl"><table><thead><tr><th>Approach</th><th>Rows/sec (typical order)</th></tr></thead><tbody>
   <tr><td>Row-by-row INSERT</td><td class="num">10²–10³</td></tr>
   <tr><td>Batched INSERT</td><td class="num">10⁴</td></tr>
   <tr><td>Bulk COPY from staged files</td><td class="num">10⁵–10⁶+</td></tr>
  </tbody></table></div>
  <p class="hint">Rough orders of magnitude; real numbers depend on row width, warehouse and network.</p>`},
 {id:"memory",t:"Memory and caching",h:()=>`
  <div class="eyebrow">Step 7</div><h1>Memory, spill and caching</h1>
  <p>When a sort, join or aggregation doesn't fit in memory, it spills to disk and slows down sharply.</p>
  ${pts(["<b>Reduce spill:</b> more and smaller partitions, fewer columns carried, or more executor memory as a last resort.","<b>Cache only what you reuse.</b> Caching a DataFrame used once costs memory and gives nothing. Unpersist when done.","<b>Avoid collecting to the driver.</b> <code>collect()</code> or <code>toPandas()</code> on large data overloads a single machine.","<b>Prefer built-in functions to UDFs.</b> Python UDFs serialize rows between engines and block optimizations."])}
  ${dd(["Cache a cleaned table reused by several outputs","Use built-in SQL functions","Check the spill columns in job metrics"],["Caching everything by default","Python UDFs for simple string or date logic","Raising memory before checking for skew"])}`},
 {id:"orchestration",t:"Orchestration and cost",h:()=>`
  <div class="eyebrow">Step 8</div><h1>Orchestration and cost</h1>
  ${pts(["<b>Run independent tasks in parallel.</b> A DAG that runs everything in sequence wastes most of the cluster.","<b>Shorten the critical path.</b> The longest chain of dependent tasks sets the total run time.","<b>Right-size compute per task.</b> A small cluster for light tasks, a large one for the heavy transform.","<b>Autoscaling and spot instances</b> cut cost for fault-tolerant batch work.","<b>Schedule around contention.</b> Shared warehouses slow down at peak hours.","<b>Track cost per run</b> next to run time. A faster run that costs four times as much isn't always a win."])}
  <div class="callout"><b>Watch the trend.</b> Plot run time per day. A slow, steady climb usually means full reloads or growing small files, long before anyone notices a failure.</div>`},
 {id:"diagnose",t:"Diagnose a symptom",h:()=>`
  <div class="eyebrow">Tool</div><h1>What are you seeing?</h1>
  <p>Pick a symptom to see the likely cause and what to try.</p>
  <div class="symptoms" id="symptoms">${Object.keys(SYMPTOMS).map(s=>`<button class="chip" type="button" data-s="${s}" aria-pressed="${s===symSel}">${s}</button>`).join("")}</div>
  <div class="diag" id="diag"></div>`,after:renderDiag},
 {id:"checklist",t:"Checklist",h:()=>`
  <div class="eyebrow">Tool</div><h1>Pipeline review checklist</h1>
  <p>Tick what your pipeline already does. Ticks are saved in this browser.</p>
  <ul class="check" id="check">${CHECK.map((c,i)=>`<li><label><input type="checkbox" id="chk${i}" data-i="${i}" ${checks[i]?"checked":""}><span>${c}</span></label></li>`).join("")}</ul>
  <p class="tally" id="tally"></p>`,after:renderCheck},
 {id:"quiz",t:"Self-check",h:()=>`
  <div class="eyebrow">Practice</div><h1>Self-check</h1>
  <p>Six questions. Click an answer to see whether it's right and why.</p>
  <p class="score" id="score"></p>
  <div id="quiz">${QUIZ.map((x,i)=>`<div class="q"><h3>${i+1}. ${x.q}</h3><div class="opts">${x.o.map((o,j)=>`<button class="opt" type="button" data-q="${i}" data-o="${j}">${o}</button>`).join("")}</div><p class="why" id="why${i}" hidden>${x.w}</p></div>`).join("")}</div>`,after:renderQuiz}
];

const $=id=>document.getElementById(id);
let cur=0; const seen=new Set();

function renderFlow(){
  const total=STAGES.reduce((s,x)=>s+x.t,0), max=Math.max(...STAGES.map(x=>x.t));
  $("flow").innerHTML=STAGES.map((s,i)=>`${i?'<span class="arrow">→</span>':""}<button class="stg${s.slow?" slow":""}" type="button" data-i="${i}" aria-pressed="${i===stageSel}"><b>${s.n}</b><span class="t">${s.t} min · ${Math.round(s.t/total*100)}%</span><span class="bar" style="width:${Math.max(6,s.t/max*100)}%"></span></button>`).join("");
  $("stgdetail").innerHTML=`<b>${STAGES[stageSel].n}:</b> ${STAGES[stageSel].d}`;
  $("flow").querySelectorAll(".stg").forEach(b=>b.onclick=()=>{stageSel=+b.dataset.i;renderFlow()});
}
function renderDiag(){
  const a=SYMPTOMS[symSel];
  $("diag").innerHTML=`<p>${a[0]}</p>${pts(a.slice(1))}`;
  $("symptoms").querySelectorAll(".chip").forEach(c=>{c.setAttribute("aria-pressed",c.dataset.s===symSel);c.onclick=()=>{symSel=c.dataset.s;renderDiag()}});
}
function renderCheck(){
  const n=CHECK.filter((_,i)=>checks[i]).length;
  $("tally").textContent=`${n} of ${CHECK.length} in place`;
  $("check").querySelectorAll("input").forEach(c=>c.onchange=()=>{checks[c.dataset.i]=c.checked;try{localStorage.setItem("ptg-checks",JSON.stringify(checks))}catch(e){}renderCheck()});
}
function renderQuiz(){
  $("quiz").querySelectorAll(".opt").forEach(b=>{
    const q=+b.dataset.q,o=+b.dataset.o;
    b.classList.remove("right","wrong");
    if(answers[q]!==undefined){
      if(o===QUIZ[q].a)b.classList.add("right");
      else if(o===answers[q])b.classList.add("wrong");
      $("why"+q).hidden=false;
    }
    b.onclick=()=>{answers[q]=o;renderQuiz()};
  });
  const done=Object.keys(answers).length, right=Object.entries(answers).filter(([q,o])=>QUIZ[q].a===o).length;
  $("score").textContent=done?`${right} of ${done} answered correctly${done===QUIZ.length?" · all done":""}`:"";
}

function buildRail(){
  $("steps").innerHTML=STEPS.map((s,i)=>`<li><button type="button" data-i="${i}"><span class="no">${String(i+1).padStart(2,"0")}</span><span>${s.t}</span></button></li>`).join("");
  $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $("meter").innerHTML=STEPS.map(()=>"<i></i>").join("");
}
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i)); seen.add(cur);
  const s=STEPS[cur], v=$("view");
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  v.innerHTML=s.h(); s.after&&s.after();
  $("steps").querySelectorAll("button").forEach(b=>{
    const k=+b.dataset.i; b.classList.toggle("seen",seen.has(k));
    if(k===cur){b.setAttribute("aria-current","step");b.scrollIntoView({block:"nearest",inline:"nearest"})}else b.removeAttribute("aria-current")});
  $("meter").querySelectorAll("i").forEach((m,k)=>m.classList.toggle("on",k<=cur));
  $("prev").disabled=cur===0; $("next").disabled=cur===STEPS.length-1;
  $("prevT").textContent=cur>0?STEPS[cur-1].t:""; $("nextT").textContent=cur<STEPS.length-1?STEPS[cur+1].t:"";
  $("count").textContent=`${cur+1} / ${STEPS.length}`;
  if(location.hash.slice(1)!==s.id) history.replaceState(null,"","#"+s.id);
  if(window.scrollY>150) window.scrollTo({top:0});
}
$("prev").onclick=()=>go(cur-1);
$("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{
  if(e.target.matches&&e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight")go(cur+1);
  if(e.key==="ArrowLeft")go(cur-1);
});
window.addEventListener("hashchange",()=>{const i=STEPS.findIndex(s=>s.id===location.hash.slice(1));if(i>=0&&i!==cur)go(i)});

const modes=["system","light","dark"]; let mode=0;
try{mode=Math.max(0,modes.indexOf(localStorage.getItem("ptg-theme")||"system"))}catch(e){}
function applyTheme(){
  const m=modes[mode];
  if(m==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",m);
  $("theme").textContent="Theme: "+m;
}
$("theme").onclick=()=>{mode=(mode+1)%3;try{localStorage.setItem("ptg-theme",modes[mode])}catch(e){}applyTheme()};
applyTheme();
buildRail();
go(Math.max(0,STEPS.findIndex(s=>s.id===location.hash.slice(1))));
</script>
